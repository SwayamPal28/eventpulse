apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketing-staging

resources:
  - ../../base

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: reservation-service
    spec:
      replicas: 5
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: catalog-service
    spec:
      replicas: 5

commonLabels:
  environment: staging
