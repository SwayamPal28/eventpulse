apiVersion: v1
kind: ConfigMap
metadata:
  name: eventpulse-config
  namespace: ticketing-dev
data:
  REDIS_HOST: "eventpulse-redis.ticketing-dev.svc.cluster.local"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "eventpulse-rabbitmq.ticketing-dev.svc.cluster.local"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_ENDPOINT_URL: "http://localstack.ticketing-dev.svc.cluster.local:4566"
  CASSANDRA_HOST: "eventpulse-cassandra.ticketing-dev.svc.cluster.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: eventpulse-secrets
  namespace: ticketing-dev
type: Opaque
stringData:
  DATABASE_URL: "postgresql://eventpulse_user:eventpulse_secure_password_2026@postgres:5432/eventpulse_db"
  JWT_SECRET: "eventpulse_super_secret_signing_key_2026"
  HMAC_KEY: "eventpulse_qr_hmac_secret_2026"
