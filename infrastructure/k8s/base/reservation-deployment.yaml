apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
  namespace: ticketing-dev
  labels:
    app: reservation-service
    tier: command
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: reservation-service
  template:
    metadata:
      labels:
        app: reservation-service
    spec:
      containers:
        - name: reservation-service
          image: eventpulse/reservation-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: eventpulse-config
            - secretRef:
                name: eventpulse-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: reservation-service
  namespace: ticketing-dev
spec:
  type: ClusterIP
  selector:
    app: reservation-service
  ports:
    - port: 8001
      targetPort: 8001
